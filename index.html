<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Генератор JSON акции</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#252a32;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:1360px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.eyebrow{margin:0 0 6px;color:#008a1f;font-size:13px;font-weight:800;text-transform:uppercase}h1{margin:0;font-size:clamp(30px,4vw,46px)}h2,h3{margin-top:0}.actions{display:flex;gap:10px;min-width:360px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:18px;align-items:start}.stack{display:grid;gap:16px}.panel{min-width:0;background:#fff;border:1px solid #d9dee7;border-radius:8px;box-shadow:0 18px 50px rgba(31,41,55,.12);padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}label{display:grid;gap:7px;margin-bottom:14px;color:#687284;font-size:13px;font-weight:700}input,textarea,select,button{font:inherit;min-width:0}input,textarea,select{width:100%;border:1px solid #d9dee7;border-radius:8px;padding:11px 12px;font-weight:650}textarea{resize:vertical;line-height:1.45}button{border:0;border-radius:8px;background:#111722;color:#fff;font-weight:800;cursor:pointer;padding:10px 14px;white-space:nowrap}.secondary{border:1px solid #d9dee7;background:#fff;color:#252a32}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rules{display:grid;gap:12px}.rule,.term{border:1px solid #d9dee7;border-radius:8px;background:#fbfcfd;padding:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.icon{background:transparent;color:#c33838;padding:0;width:32px;height:32px;font-size:24px}.toggles{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}.check{display:flex;align-items:center;gap:8px;margin:0;color:#252a32}.check input{width:18px;height:18px}.hidden{display:none}.terms{border:1px solid #d9dee7;border-radius:8px;background:#fff;padding:12px}.termgrid{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(120px,.8fr) minmax(220px,1.6fr);gap:10px}.termgrid label{margin-bottom:0}.footer{display:flex;justify-content:flex-end;margin-top:14px}.json-actions{display:flex;gap:8px}.json-actions button:first-child{background:#fff;color:#252a32;border:1px solid #d9dee7}.json-actions button:last-child{background:#27d957;color:#07140b}pre{margin:0;max-height:460px;overflow:auto;background:#111722;color:#e8edf5;border-radius:8px;padding:14px;font-size:12px;line-height:1.5}.phone{width:min(360px,100%);height:740px;margin:auto;overflow:hidden;border:10px solid #111;border-radius:32px;background:#fff;box-shadow:0 18px 48px rgba(0,0,0,.2)}.status{height:34px;padding:8px 20px 0;font-size:13px;font-weight:800}.ph{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center;padding:6px 12px 12px}.ph button{width:40px;height:40px;border-radius:10px;background:#f0f2f5;color:#222;font-size:34px;line-height:24px;padding:0}.pb{height:644px;overflow:auto;padding:0 16px 28px}.hero{width:100%;aspect-ratio:328/184;object-fit:cover;border-radius:10px;background:#101820}.preview-h{margin:16px 0 14px;font-size:22px;line-height:1.12}.rp{margin-top:18px}.rp h3{font-size:20px;margin-bottom:8px}.rp p,.intro{font-size:17px;line-height:1.45;white-space:pre-line}.widget{margin-top:14px;border-radius:10px;background:#12251f;color:#fff;padding:12px;background-size:cover;background-position:center}.widget strong{display:block;margin-bottom:7px}.wr{display:flex;justify-content:space-between;gap:12px;font-size:12px}.bar{height:7px;margin-top:8px;border-radius:999px;background:rgba(255,255,255,.8);overflow:hidden}.bar span{display:block;width:62%;height:100%;background:#27d957}.tcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}.tcard{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;min-height:78px;border-radius:9px;background:#eef0f5;padding:10px}.tcard img{width:22px;height:22px;object-fit:contain}.tcard small{display:block;color:#657084}.tcard strong{display:block;margin-top:5px;font-size:18px}.primary,.secondary-link{display:block;width:100%;margin-top:24px;padding:14px;text-align:center;text-decoration:none;font-weight:800}.primary{border-radius:8px;background:#27d957;color:#08150d}.secondary-link{color:#008a1f}@media(max-width:1120px){.grid{grid-template-columns:1fr}.output{grid-template-columns:minmax(0,390px) minmax(0,1fr)}}@media(max-width:760px){main{padding:14px}.top,.actions,.grid,.output,.two,.termgrid{display:grid;grid-template-columns:1fr;min-width:0}.head{align-items:stretch;flex-direction:column}.json-actions{width:100%}.json-actions button,.footer button{width:100%}.footer{justify-content:stretch}.phone{height:620px}.pb{height:524px}}
</style>
</head>
<body>
<main>
<header class="top"><div><p class="eyebrow">Маркетинговые акции</p><h1>Генератор JSON раздела</h1></div><div class="actions"><select id="template"><option value="offer">Оффер</option><option value="tasks">Задания</option><option value="blank">Пустой шаблон</option></select><button class="secondary" id="load" type="button">Загрузить</button></div></header>
<div class="grid"><form class="stack" id="form"><section class="panel"><div class="head"><h2>Основное</h2></div><label>Promo ID<textarea id="promoIds" rows="2"></textarea></label><div class="two"><label>Title<input id="title"></label><label>Header<input id="header"></label></div><label>Image URL<input id="imageUrl" type="url"></label><label>Intro content<textarea id="content" rows="3"></textarea></label></section><section class="panel"><div class="head"><h2>Разделы</h2></div><div class="rules" id="rules"></div><div class="footer"><button class="secondary" id="addRule" type="button">Добавить раздел</button></div></section><section class="panel"><div class="head"><h2>Кнопки</h2></div><div class="two"><label>Primary text<input id="primaryText"></label><label>Primary URL<input id="primaryUrl"></label></div><div class="two"><label>Secondary text<input id="secondaryText"></label><label>Secondary URL<input id="secondaryUrl"></label></div></section></form>
<aside class="stack output"><section class="panel"><div class="head"><h2>Превью</h2><strong style="color:#008a1f;background:#e9f9ee;border-radius:999px;padding:6px 10px" id="badge">JSON готов</strong></div><div class="phone"><div class="status">9:41</div><div class="ph"><button type="button">‹</button><strong id="previewTitle">Акция</strong><span></span></div><div class="pb" id="preview"></div></div></section><section class="panel"><div class="head"><h2>JSON</h2><div class="json-actions"><button type="button" id="download">Скачать .json</button><button type="button" id="copy">Скопировать</button></div></div><pre id="json"></pre></section></aside></div>
</main>
<template id="ruleTpl"><article class="rule"><div class="row"><h3></h3><button class="icon remove-rule" type="button">×</button></div><label>Заголовок раздела<input class="rhead"></label><label>Текст раздела<textarea class="rcontent" rows="5"></textarea></label><div class="toggles"><label class="check"><input class="wenabled" type="checkbox">Прогресс-виджет</label><label class="check"><input class="tenabled" type="checkbox">Плитки условий</label></div><div class="wfields hidden"><div class="two"><label>Campaign ID<input class="wcampaign"></label><label>Widget title<input class="wtitle"></label></div><div class="two"><label>Progress text<input class="wprogress"></label><label>Widget image URL<input class="wimage"></label></div></div><div class="terms hidden"><div class="row" style="margin-bottom:10px"><div><h3 style="font-size:15px;margin:0 0 4px">Плитки условий</h3><p style="margin:0;color:#687284;font-size:12px">Одна строка ниже формирует одну плитку в JSON</p></div><button class="secondary add-term" type="button">Добавить плитку</button></div><div class="termlist"></div></div></article></template>
<template id="termTpl"><article class="term"><div class="row"><strong></strong><button class="icon remove-term" type="button">×</button></div><div class="termgrid"><label>Заголовок<input class="thead" placeholder="ЭТАП 2"></label><label>Текст / сумма<input class="tcontent" placeholder="1000"></label><label>Иконка URL<input class="timage" placeholder="https://..."></label></div></article></template>
<script>
const W="https://www.ligastavok.ru/files/file/16326/Marketing_widgetProgressBar_Bg.webp";
const I="https://www.ligastavok.ru/files/file/11160/Freebet_3x.webp";
function widgetRule(header,content,campaignId,progressText,title="Твой прогресс",imageUrl=W){return{header,content,widgets:[{type:"progressBar",position:"bottom",enabled:true,campaignId,title,progressText,imageUrl,remainingTime:{dateLabel:"Осталось дней",timeLabel:"Осталось:"}}]};}
const templates={
  offer:{switcherByPromoId:["S_FBV_VGD500_2305","TESTDV"],common:{title:"Акция",imageUrl:"https://www.ligastavok.ru/files/file/14559/freebetVsem_marketingPromoImg.webp",header:"Фрибет 500",content:"",rules:[widgetRule("Основная информация","Пополни счёт от 500 ₽, затем сделай одну или несколько ставок с кэфом от 1,3 на 500 ₽ и получи фрибет 500","S_FBV_VGD500_2305","Ставок сделано на сумму, ₽:"),{header:"Какие ставки учитываются",content:"Учитываются все рассчитанные пари с кэфом от 1,3, кроме «систем», ставок на фрибет и на быстрые игры, а также ставок со статусом «Отмена», «Выкуп» и «Возврат»"},{header:"Успей до 6 июня",content:"Пополни счёт, сделай ставки и дождись их расчёта до 6 июня 12:00 МСК"},{header:"Когда начислят фрибет",content:"Фрибет будет начислен после расчёта всех ставок. Фрибет действует 7 дней с момента начисления для пари вида «одинар»",terms:[]}],primaryButtonText:"За фрибетом",primaryButtonUrl:"https://www.ligastavok.ru/PersonalFolder/Accounts/Deposit",secondaryButtonText:"Полные правила акции",secondaryButtonUrl:"https://www.ligastavok.ru/files/file/16671/FREEBETVSEM.pdf"}},
  tasks:{switcherByPromoId:["TEST_REACT_TASK1","TESTDV","S_FBV_ZAD1000_2305"],common:{title:"Акция",imageUrl:"https://www.ligastavok.ru/files/file/16685/marketingimg_rebrand_2.webp",header:"Фрибет 1000",content:"",rules:[{header:"Основная информация",content:"Выполни все задания, получи фрибет 1000 и переходи к следующему этапу с бонусом 1500\n\nЗадания могут выполняться параллельно и в любом порядке."},widgetRule("Задание №1","Единоразово пополни счёт от 1000 ₽","S_FBV_ZAD1000_2305_DEP","Депозитов внесено:"),widgetRule("Задание №2","Заключи выигрышный «одинар» от 500 ₽ с кэфом от 1,7 в Live","S_FBV_ZAD1000_2305_WIN_LIVE_BET","Выигранных одинаров:"),{header:"Успей до 6 июня",content:"Выполни задания до 6 июня 12:00 МСК.",terms:[{header:"ЭТАП 2",content:"1000",imageUrl:I},{header:"ЭТАП 3",content:"1500",imageUrl:I},{header:"ЭТАП 4",content:"2000",imageUrl:I},{header:"ЭТАП 5",content:"10 000",imageUrl:I}]}],primaryButtonText:"За фрибетом",primaryButtonUrl:"https://www.ligastavok.ru/home",secondaryButtonText:"Полные правила акции",secondaryButtonUrl:"https://www.ligastavok.ru/files/file/16671/FREEBETVSEM.pdf"}},
  blank:{switcherByPromoId:[""],common:{title:"Акция",imageUrl:"",header:"",content:"",rules:[{header:"Основная информация",content:""}],primaryButtonText:"Участвовать",primaryButtonUrl:"https://www.ligastavok.ru/home",secondaryButtonText:"Полные правила акции",secondaryButtonUrl:""}}
};
const $=s=>document.querySelector(s);const rules=$("#rules"),json=$("#json"),preview=$("#preview"),ruleTpl=$("#ruleTpl"),termTpl=$("#termTpl");
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function clone(v){return JSON.parse(JSON.stringify(v));}
function load(name){const d=clone(templates[name]||templates.offer),c=d.common;$("#template").value=name in templates?name:"offer";$("#promoIds").value=d.switcherByPromoId.join(", ");$("#title").value=c.title||"";$("#header").value=c.header||"";$("#imageUrl").value=c.imageUrl||"";$("#content").value=c.content||"";$("#primaryText").value=c.primaryButtonText||"";$("#primaryUrl").value=c.primaryButtonUrl||"";$("#secondaryText").value=c.secondaryButtonText||"";$("#secondaryUrl").value=c.secondaryButtonUrl||"";rules.innerHTML="";c.rules.forEach(addRule);update();}
function addRule(r={header:"",content:""}){const n=ruleTpl.content.firstElementChild.cloneNode(true);n.querySelector(".rhead").value=r.header||"";n.querySelector(".rcontent").value=r.content||"";const w=r.widgets?.[0],we=n.querySelector(".wenabled"),wf=n.querySelector(".wfields");we.checked=!!w;wf.classList.toggle("hidden",!w);n.querySelector(".wcampaign").value=w?.campaignId||"";n.querySelector(".wtitle").value=w?.title||"Твой прогресс";n.querySelector(".wprogress").value=w?.progressText||"";n.querySelector(".wimage").value=w?.imageUrl||W;const te=n.querySelector(".tenabled"),box=n.querySelector(".terms"),list=n.querySelector(".termlist");te.checked=Array.isArray(r.terms);box.classList.toggle("hidden",!Array.isArray(r.terms));(r.terms||[]).forEach(t=>addTerm(list,t));we.onchange=()=>{wf.classList.toggle("hidden",!we.checked);update();};te.onchange=()=>{box.classList.toggle("hidden",!te.checked);if(te.checked&&!list.children.length)addTerm(list);update();};n.querySelector(".add-term").onclick=()=>{addTerm(list);update();};n.querySelector(".remove-rule").onclick=()=>{n.remove();renumRules();update();};rules.append(n);renumRules();}
function addTerm(list,t={header:"",content:"",imageUrl:I}){const n=termTpl.content.firstElementChild.cloneNode(true);n.querySelector(".thead").value=t.header||"";n.querySelector(".tcontent").value=t.content||"";n.querySelector(".timage").value=t.imageUrl||I;n.querySelector(".remove-term").onclick=()=>{n.remove();renumTerms(list);update();};list.append(n);renumTerms(list);}
function renumRules(){[...rules.children].forEach((n,i)=>n.querySelector("h3").textContent=`Раздел ${i+1}`);}function renumTerms(list){[...list.children].forEach((n,i)=>n.querySelector("strong").textContent=`Плитка ${i+1}`);}
function promoIds(){return $("#promoIds").value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);}
function collectTerms(n){return[...n.querySelectorAll(".term")].map(t=>{const img=t.querySelector(".timage").value.trim();return{header:t.querySelector(".thead").value.trim(),content:t.querySelector(".tcontent").value.trim(),imageUrl:img||I,has:!!img};}).filter(t=>t.header||t.content||t.has).map(({has,...t})=>t);}
function collectRules(){return[...rules.children].map(n=>{const r={header:n.querySelector(".rhead").value.trim(),content:n.querySelector(".rcontent").value};if(n.querySelector(".wenabled").checked)r.widgets=[{type:"progressBar",position:"bottom",enabled:true,campaignId:n.querySelector(".wcampaign").value.trim(),title:n.querySelector(".wtitle").value.trim()||"Твой прогресс",progressText:n.querySelector(".wprogress").value.trim(),imageUrl:n.querySelector(".wimage").value.trim()||W,remainingTime:{dateLabel:"Осталось дней",timeLabel:"Осталось:"}}];if(n.querySelector(".tenabled").checked)r.terms=collectTerms(n);return r;});}
function build(){const common={title:$("#title").value.trim(),imageUrl:$("#imageUrl").value.trim(),header:$("#header").value.trim()};if($("#content").value.trim())common.content=$("#content").value;common.rules=collectRules();common.primaryButtonText=$("#primaryText").value.trim();common.primaryButtonUrl=$("#primaryUrl").value.trim();common.secondaryButtonText=$("#secondaryText").value.trim();common.secondaryButtonUrl=$("#secondaryUrl").value.trim();return{switcherByPromoId:promoIds(),common,failures:[{type:"common",header:"Не смогли загрузить данные",content:"Обновите страницу или вернитесь позже",buttonText:"Обновить"},{type:"noAccess",header:"Текущая акция для вас недоступна",content:"Вы можете обратиться в службу<br>поддержки для выяснения причин"}]};}
function renderWidget(w){return`<div class="widget" style="background-image:linear-gradient(rgba(9,18,16,.45),rgba(9,18,16,.45)),url('${esc(w.imageUrl)}')"><strong>${esc(w.title||"Твой прогресс")}</strong><div class="wr"><span>${esc(w.progressText||"Прогресс:")}</span><span>1 280 из 2 000</span></div><div class="bar"><span></span></div></div>`;}
function renderTerms(ts){return`<div class="tcards">${ts.map(t=>`<div class="tcard"><img src="${esc(t.imageUrl)}" alt=""><div><small>${esc(t.header)}</small><strong>${esc(t.content)}</strong></div></div>`).join("")}</div>`;}
function renderRule(r){return`<section class="rp"><h3>${esc(r.header||"Раздел")}</h3><p>${esc(r.content||"")}</p>${r.widgets?.[0]?renderWidget(r.widgets[0]):""}${Array.isArray(r.terms)&&r.terms.length?renderTerms(r.terms):""}</section>`;}
function update(){const d=build(),c=d.common;json.textContent=JSON.stringify(d,null,2);$("#previewTitle").textContent=c.title||"Акция";$("#badge").textContent=d.switcherByPromoId.length?"JSON готов":"Нет Promo ID";preview.innerHTML=`${c.imageUrl?`<img class="hero" src="${esc(c.imageUrl)}" alt="">`:`<div class="hero"></div>`}<h2 class="preview-h">${esc(c.header||"Заголовок акции")}</h2>${c.content?`<p class="intro">${esc(c.content)}</p>`:""}${c.rules.map(renderRule).join("")}${c.primaryButtonText?`<a class="primary" href="${esc(c.primaryButtonUrl||"#")}">${esc(c.primaryButtonText)}</a>`:""}${c.secondaryButtonText?`<a class="secondary-link" href="${esc(c.secondaryButtonUrl||"#")}">${esc(c.secondaryButtonText)}</a>`:""}`;}
$("#form").addEventListener("input",update);$("#addRule").onclick=()=>{addRule();update();};$("#load").onclick=()=>load($("#template").value);$("#copy").onclick=async()=>{await navigator.clipboard.writeText(json.textContent);$("#copy").textContent="Скопировано";setTimeout(()=>$("#copy").textContent="Скопировать",1200);};$("#download").onclick=()=>{const d=build(),blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a"),id=d.switcherByPromoId[0]||"promo-action";a.href=url;a.download=id.toLowerCase().replace(/[^a-z0-9а-яё_-]+/gi,"-")+".json";a.click();URL.revokeObjectURL(url);};
$("#template").value="offer";load("offer");
</script>
</body>
</html>
